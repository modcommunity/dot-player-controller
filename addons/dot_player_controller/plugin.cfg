[plugin]

name="dot-player-controller"
description="Everything that drives a player, in one addon: one tick of intent as a wire-ready value, look accumulation that clamps pitch and wraps yaw, a switch that keeps exactly one controller driving and hands position, velocity and view across, first-person movement with strafe acceleration and stair stepping simulated from explicit commands, and a third-person motor with an orbit rig and a shoulder it can swap. Depends on dot-core and dot-player; dot-net is optional."
author="dot"
version="0.3.0"
script="dot_player_controller_plugin.gd"
